<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KWA Cash Book - Office Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="kwa-core.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-slate-800 uppercase tracking-wide">Kerala Water Authority</h1>
      <p class="text-sm text-slate-500 mt-1">Cash Book Management Login</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Office Email ID</label>
        <input type="email" id="email" required 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"
          placeholder="e.g. thiruvalla@kwa.gov.in">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"
          placeholder="••••••••">
      </div>

      <button type="submit" id="loginBtn" 
        class="w-full bg-[#003366] text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-[#002244] transition">
        Sign In to Office Dashboard
      </button>
    </form>

    <div id="errorMessage" class="mt-4 text-center text-xs text-red-600 font-medium hidden"></div>
  </div>

  <!-- Link your script file -->
  <script src="app.js"></script>
</body>
</html>
