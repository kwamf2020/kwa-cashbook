<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KWA Initial Office Setup</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6 flex items-center justify-center">

  <div class="bg-white p-8 rounded-lg shadow-md border border-slate-200 w-full max-w-2xl">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold uppercase text-[#003366]">Kerala Water Authority</h1>
      <p class="text-xs text-slate-500">Initial Office & Cash Book Setup Wizard</p>
    </div>

    <form id="setupForm" onsubmit="handleSetupSubmit(event)">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Office Name *</label>
          <input type="text" id="officeName" required placeholder="e.g. PH Division Thiruvalla" class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ARU Code *</label>
          <input type="text" id="aruCode" required placeholder="e.g. ARU-1024" class="w-full px-3 py-2 border rounded text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Starting Month (e.g. October-2026) *</label>
          <input type="text" id="startingMonth" required placeholder="October-2026" class="w-full px-3 py-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Initial Cash Opening Balance (₹) *</label>
          <input type="number" step="0.01" id="cashOpening" required value="0.00" class="w-full px-3 py-2 border rounded text-sm">
        </div>
      </div>

      <div class="border-t pt-4 mb-4 flex justify-between items-center">
        <h3 class="text-sm font-bold text-[#004080]">Configure Initial Bank Accounts</h3>
        <button type="button" onclick="addBankSetupRow()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs px-3 py-1.5 rounded font-semibold">+ Add Bank</button>
      </div>

      <div id="bankSetupRows" class="space-y-3 mb-6">
        <!-- Dynamic rows injected here -->
      </div>

      <button type="submit" class="w-full bg-[#003366] hover:bg-[#002244] text-white py-2 rounded text-sm font-semibold transition">
        Complete Setup & Launch Cash Book
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://nayvftqylbjwspmjxbjc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qGT19bz8IOnF4-vWCbk4aQ_UCcaBc9U';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const bankLogos = {
      "State Bank of India": "https://drive.google.com/uc?export=view&id=1epq0kaBXIMoZFB-fEWZ3SQcQNBuEwqib",
      "Punjab National Bank": "https://drive.google.com/uc?export=view&id=1sPajG-NVVOpg2UQXOMMBSUy0C8HJ3wcB",
      "Federal Bank": "https://drive.google.com/uc?export=view&id=1m8Y5D5Jak61WyyCrJuY1cZ3Y7W-7mgop",
      "Indian Bank": "https://drive.google.com/uc?export=view&id=10tfiHP2ofwGCK2qc515fPWdWALK-lZ9L"
    };

    let userId = '';

    window.onload = async function() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      userId = session.user.id;

      // Check if setup already done
      const { data } = await supabaseClient.from('office_settings').select('*').eq('office_id', userId).single();
      if (data) {
        window.location.href = 'index.html';
      } else {
        addBankSetupRow();
      }
    };

    function addBankSetupRow() {
      const container = document.getElementById('bankSetupRows');
      const rowId = 'bank_row_' + Date.now();
      
      let bankOptions = '';
      Object.keys(bankLogos).forEach(b => bankOptions += `<option value="${b}">${b}</option>`);

      const div = document.createElement('div');
      div.id = rowId;
      div.className = "grid grid-cols-1 md:grid-cols-6 gap-2 p-3 bg-slate-50 border rounded text-xs items-center";
      div.innerHTML = `
        <div><input type="text" class="b-nick w-full p-1.5 border rounded text-xs" placeholder="Nickname" required></div>
        <div><input type="text" class="b-acc w-full p-1.5 border rounded text-xs" placeholder="Account No" required></div>
        <div><select class="b-name w-full p-1.5 border rounded text-xs bg-white" required>${bankOptions}</select></div>
        <div><select class="b-cat w-full p-1.5 border rounded text-xs bg-white"><option value="Drawing">Drawing</option><option value="Non Operative">Non Operative</option></select></div>
        <div><input type="number" step="0.01" class="b-open w-full p-1.5 border rounded text-xs text-right" placeholder="Opening Bal" required value="0.00"></div>
        <div class="text-center"><button type="button" onclick="document.getElementById('${rowId}').remove()" class="bg-red-500 text-white px-2 py-1 rounded text-xs">✕</button></div>
      `;
      container.appendChild(div);
    }

    async function handleSetupSubmit(e) {
      e.preventDefault();
      const officeName = document.getElementById('officeName').value.trim();
      const aruCode = document.getElementById('aruCode').value.trim();
      const startingMonth = document.getElementById('startingMonth').value.trim();
      const cashOpening = parseFloat(document.getElementById('cashOpening').value || 0);

      const bankRows = document.querySelectorAll('#bankSetupRows > div');
      const banksToInsert = [];

      bankRows.forEach(r => {
        const nickname = r.querySelector('.b-nick').value.trim();
        const accNo = r.querySelector('.b-acc').value.trim();
        const bankName = r.querySelector('.b-name').value;
        const category = r.querySelector('.b-cat').value;
        const openBal = parseFloat(r.querySelector('.b-open').value || 0);

        banksToInsert.push({
          office_id: userId,
          account_nickname: nickname,
          account_no: accNo,
          bank_name: bankName,
          category: category,
          opening_balance: openBal,
          passbook_balance: openBal,
          logo_url: bankLogos[bankName] || ''
        });
      });

      Swal.fire({ title: 'Saving Setup...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      // Save office settings
      const { error: setErr } = await supabaseClient.from('office_settings').insert([{
        office_id: userId,
        office_name: officeName,
        aru_code: aruCode,
        starting_month: startingMonth,
        current_active_month: startingMonth
      }]);

      if (setErr) { Swal.fire('Error', setErr.message, 'error'); return; }

      // Save banks
      if (banksToInsert.length > 0) {
        const { error: bankErr } = await supabaseClient.from('bank_master').insert(banksToInsert);
        if (bankErr) { Swal.fire('Error', bankErr.message, 'error'); return; }
      }

      // Save initial cash opening in monthly_closings for starting month
      await supabaseClient.from('monthly_closings').insert([{
        office_id: userId,
        month_year: startingMonth,
        account_type: 'Cash',
        bank_nickname: null,
        account_no: null,
        category: 'Cash',
        opening_balance: cashOpening,
        total_receipts: 0,
        total_payments: 0,
        closing_balance: cashOpening
      }]);

      Swal.fire({ title: 'Success!', text: 'Office setup completed!', icon: 'success', timer: 1500, showConfirmButton: false });
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
