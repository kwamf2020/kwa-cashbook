<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KWA Bank Balances & Master Setup</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6">

  <!-- Top Banner -->
  <div class="bg-[#003366] text-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6">
    <div>
      <h1 class="text-lg font-bold uppercase">Kerala Water Authority</h1>
      <p class="text-xs opacity-80">Bank Master & Balances Management</p>
    </div>
    <div class="flex gap-3">
      <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded font-semibold transition">← Back to Cash Book</a>
      <a href="taxview.html" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded font-semibold transition">Tax Report →</a>
    </div>
  </div>

  <!-- Bank Master Entry Form Card -->
  <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 mb-6">
    <h3 class="text-md font-bold text-[#004080] border-b pb-2 mb-4">Add / Configure Bank Account</h3>
    
    <form id="bankForm" onsubmit="handleBankSubmit(event)">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Account Nickname *</label>
          <input type="text" id="accountNickname" required placeholder="e.g. Establishment / OandM" 
            class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Bank & Account No *</label>
          <input type="text" id="bankAccountDetails" required placeholder="e.g. 57067992143 & SBI Thiruvalla" 
            class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category *</label>
          <select id="bankCategory" required class="w-full px-3 py-2 border rounded text-sm bg-white">
            <option value="Drawing">Drawing Account</option>
            <option value="Non Operative">Non Operative Account</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Opening Balance (₹) *</label>
          <input type="number" step="0.01" id="openingBalance" required value="0.00" 
            class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Passbook Balance (₹) *</label>
          <input type="number" step="0.01" id="passbookBalance" required value="0.00" 
            class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Logo URL (Optional)</label>
          <input type="text" id="logoUrl" placeholder="Image link" 
            class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-900 outline-none">
        </div>
      </div>

      <button type="submit" class="bg-[#003366] hover:bg-[#002244] text-white px-5 py-2 rounded text-sm font-semibold transition">
        Save Bank Account
      </button>
    </form>
  </div>

  <!-- Bank Balances Ledger Card -->
  <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
    <h3 class="text-md font-bold text-[#004080] border-b pb-2 mb-4">Registered Office Bank Accounts</h3>
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-xs">
        <thead>
          <tr class="bg-slate-800 text-white uppercase text-[10px]">
            <th class="p-2 border">Nickname</th>
            <th class="p-2 border">Bank & Account Details</th>
            <th class="p-2 border">Category</th>
            <th class="p-2 border text-right">Opening Balance (₹)</th>
            <th class="p-2 border text-right">Passbook Balance (₹)</th>
            <th class="p-2 border text-center">Action</th>
          </tr>
        </thead>
        <tbody id="bankTableBody">
          <tr><td colspan="6" class="p-4 text-center text-slate-500 italic">Loading bank accounts...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nayvftqylbjwspmjxbjc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qGT19bz8IOnF4-vWCbk4aQ_UCcaBc9U';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentOfficeId = '';

    window.onload = async function() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      currentOfficeId = session.user.id;
      loadBanks();
    };

    async function loadBanks() {
      const tbody = document.getElementById('bankTableBody');
      const { data, error } = await supabaseClient
        .from('bank_master')
        .select('*')
        .eq('office_id', currentOfficeId);

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Error loading banks: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">No bank accounts configured yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      data.forEach(b => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-slate-50";
        tr.innerHTML = `
          <td class="p-2 border font-bold">${b.account_nickname}</td>
          <td class="p-2 border">${b.bank_account_details}</td>
          <td class="p-2 border">${b.category}</td>
          <td class="p-2 border text-right font-mono">₹${Number(b.opening_balance).toFixed(2)}</td>
          <td class="p-2 border text-right font-mono font-semibold text-emerald-600">₹${Number(b.passbook_balance).toFixed(2)}</td>
          <td class="p-2 border text-center">
            <button onclick="deleteBank(${b.id})" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-[10px]">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function handleBankSubmit(e) {
      e.preventDefault();

      const newBank = {
        office_id: currentOfficeId,
        account_nickname: document.getElementById('accountNickname').value.trim(),
        bank_account_details: document.getElementById('bankAccountDetails').value.trim(),
        category: document.getElementById('bankCategory').value,
        opening_balance: parseFloat(document.getElementById('openingBalance').value || 0),
        passbook_balance: parseFloat(document.getElementById('passbookBalance').value || 0),
        logo_url: document.getElementById('logoUrl').value.trim()
      };

      const { error } = await supabaseClient.from('bank_master').insert([newBank]);

      if (error) {
        Swal.fire('Error', 'Failed to save bank: ' + error.message, 'error');
      } else {
        Swal.fire({ title: 'Success!', text: 'Bank account registered successfully!', icon: 'success', timer: 1500, showConfirmButton: false });
        document.getElementById('bankForm').reset();
        loadBanks();
      }
    }

    async function deleteBank(id) {
      const confirmRes = await Swal.fire({ title: 'Delete Bank?', text: 'Are you sure you want to remove this bank account setup?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
      if (!confirmRes.isConfirmed) return;

      const { error } = await supabaseClient.from('bank_master').delete().eq('id', id).eq('office_id', currentOfficeId);
      if (error) {
        Swal.fire('Error', 'Delete failed: ' + error.message, 'error');
      } else {
        loadBanks();
      }
    }
  </script>
</body>
</html>
